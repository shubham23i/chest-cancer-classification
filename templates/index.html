<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chest Cancer Classification</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
        }

        .title {
            text-align: center;
            margin-bottom: 40px;
        }

        .title h1 {
            font-size: 48px;
            color: #60a5fa;
            margin-bottom: 10px;
        }

        .title p {
            color: #cbd5e1;
            font-size: 18px;
        }

        .main-content {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            flex: 1;
            min-width: 320px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .upload-area {
            width: 100%;
            height: 350px;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            background: #0b132b;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #94a3b8;
            text-align: center;
            cursor: pointer;
        }

        .upload-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .upload-text {
            font-size: 22px;
            padding: 20px;
        }

        input[type="file"] {
            display: none;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-btn {
            background: #2563eb;
            color: white;
        }

        .upload-btn:hover {
            background: #1d4ed8;
        }

        .predict-btn {
            background: #16a34a;
            color: white;
        }

        .predict-btn:hover {
            background: #15803d;
        }

        .result-box {
            height: 350px;
            background: #0b132b;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            font-size: 32px;
            font-weight: bold;
            color: white;
        }

        .loading {
            display: none;
            margin-top: 20px;
            text-align: center;
            color: #93c5fd;
            font-size: 18px;
        }

        @media(max-width: 900px) {
            .main-content {
                flex-direction: column;
            }

            .title h1 {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="title">
            <h1>Chest Cancer Classification</h1>
            <p>AI-powered medical image prediction system</p>
        </div>

        <div class="main-content">

            <!-- Upload Section -->
            <div class="card">

                <label class="upload-area" for="file-input">

                    <span class="upload-text" id="upload-text">
                        Upload a CT Scan Image
                    </span>

                    <img id="preview-image" src="" alt="Preview">

                </label>

                <input type="file" id="file-input" accept="image/*">

                <div class="button-group">
                    <button class="upload-btn" onclick="document.getElementById('file-input').click()">
                        Upload Image
                    </button>

                    <button class="predict-btn" id="predict-btn">
                        Predict
                    </button>
                </div>

                <div class="loading" id="loading">
                    Predicting...
                </div>

            </div>

            <!-- Result Section -->
            <div class="card">

                <div class="result-box" id="result">
                    Prediction result will appear here
                </div>

            </div>

        </div>

    </div>

    <script>

        let base64Image = "";

        $("#file-input").change(function () {

            const file = this.files[0];

            if (file) {

                const reader = new FileReader();

                reader.onload = function (event) {

                    $("#preview-image")
                        .attr("src", event.target.result)
                        .show();

                    $("#upload-text").hide();

                    base64Image = event.target.result
                        .replace(/^data:image\/(png|jpeg|jpg);base64,/, "");
                };

                reader.readAsDataURL(file);
            }
        });


        $("#predict-btn").click(function () {

            if (base64Image === "") {

                alert("Please upload an image first.");
                return;
            }

            $("#loading").show();

            $.ajax({

                url: "/predict",

                type: "POST",

                contentType: "application/json",

                data: JSON.stringify({
                    image: base64Image
                }),

                success: function (response) {

                    $("#loading").hide();

                    $("#result").html(
                        response.prediction
                    );
                },

                error: function () {

                    $("#loading").hide();

                    $("#result").html(
                        "Error while predicting."
                    );
                }

            });

        });

    </script>

</body>

</html>
